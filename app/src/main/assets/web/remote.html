<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>CamLeon · Remote</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CamLeon">
<meta name="theme-color" content="#000000">
<style>
  /* Remote view: the live picture fills the screen, everything else floats on top, half-transparent.
     Portrait phone → 16:9 picture as a band in the middle, controls sit in the black area below it.
     Landscape tablet → picture fills the screen, controls cover its corners. */
  :root { color-scheme: dark; --fg:#e8eaed; --mut:#9aa0a6; --acc:#4f9cff; --err:#ff5c5c; --ok:#3ecf8e;
          --glass:rgba(44,50,60,.55); --glassOn:rgba(79,156,255,.85); }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; background:#000; color:var(--fg); font:15px/1.4 system-ui,sans-serif;
               overflow:hidden; overscroll-behavior:none; touch-action:manipulation; -webkit-user-select:none; user-select:none; }
  #pv { position:fixed; inset:0; width:100%; height:100%; object-fit:contain; background:#000; }
  .ov { position:fixed; z-index:2; }
  /* top strip: back link, the three switches, status pills */
  #top { top:0; left:0; right:0; display:flex; gap:6px; align-items:center; flex-wrap:wrap;
         padding:calc(8px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) 10px calc(10px + env(safe-area-inset-left));
         background:linear-gradient(rgba(0,0,0,.6), rgba(0,0,0,0)); pointer-events:none; }
  #top > * { pointer-events:auto; }
  a.back { color:#fff; text-decoration:none; font-weight:700; padding:4px 10px 4px 6px; border-radius:999px; background:var(--glass); }
  .pill { display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:600; background:var(--glass); color:var(--fg); white-space:nowrap; border:0; font-family:inherit; }
  .pill.on { background:rgba(62,207,142,.85); color:#06301f; }
  .pill.rec { background:rgba(255,92,92,.9); color:#fff; }
  .pill.warn { background:rgba(255,197,138,.85); color:#3a2400; }
  .pill.err { background:rgba(255,92,92,.9); color:#fff; }
  .pill.off { color:var(--mut); }
  .pill.mono { font-family:ui-monospace,monospace; }
  /* switches: tappable pills, a thin border marks them as buttons */
  button.sw { cursor:pointer; padding:6px 12px; border:1px solid rgba(255,255,255,.35); touch-action:manipulation; }
  button.sw:disabled { opacity:.4; cursor:default; }
  button.sw.off { color:var(--fg); }
  #fs { margin-left:auto; padding:3px 10px; font-size:16px; line-height:1; cursor:pointer; }
  /* bottom-right: the pad */
  #padbox { right:calc(12px + env(safe-area-inset-right)); bottom:calc(12px + env(safe-area-inset-bottom)); }
  .pad { display:grid; grid-template-columns:repeat(3,64px); grid-template-rows:repeat(3,64px); gap:6px; }
  .pad, .pad * { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  .pad button { border:0; border-radius:12px; background:var(--glass); color:#fff; font:inherit; font-size:26px; padding:0;
                touch-action:none; cursor:pointer; -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); }
  .pad button:active, .pad button.held { background:var(--glassOn); }
  .pad button:disabled { opacity:.35; }
  .pad .c { background:rgba(14,17,22,.55); color:var(--mut); font-size:30px; display:flex; align-items:center; justify-content:center; border-radius:12px; }
  .pad .c.on { color:#fff; background:var(--glass); }
  /* bottom-left: speed */
  #left { left:calc(12px + env(safe-area-inset-left)); bottom:calc(12px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:8px; align-items:flex-start; }
  button.sm { border:0; border-radius:10px; background:var(--glass); color:#fff; font:inherit; font-size:13px; font-weight:600; padding:9px 12px; cursor:pointer; touch-action:manipulation; }
  button.sm:disabled { opacity:.35; } button.sm.stop { background:rgba(255,92,92,.85); }
  #spdbox { background:var(--glass); border-radius:12px; padding:8px 12px; font-size:13px; color:var(--fg); display:flex; align-items:center; gap:8px; }
  #spd { width:140px; accent-color:var(--acc); }
  /* centre message / start button (autoplay blocked, no media path) */
  #mid { left:50%; top:50%; transform:translate(-50%,-50%); text-align:center; max-width:min(90vw, 420px); display:none; }
  #mid .msg { background:rgba(0,0,0,.6); border-radius:12px; padding:12px 16px; font-size:14px; }
  #mid .msg b { color:var(--err); }
  #pvstart { margin-top:10px; background:var(--acc); font-size:15px; padding:12px 20px; }
  /* small screens: a bit smaller pad */
  @media (max-width:420px), (max-height:420px) { .pad { grid-template-columns:repeat(3,54px); grid-template-rows:repeat(3,54px); } .pad button { font-size:22px; } #spd { width:100px; } }
</style>
</head>
<body>
<video id="pv" autoplay playsinline muted></video>

<div id="top" class="ov">
  <a class="back" href="/">‹ CamLeon</a>
  <button class="pill sw" id="swTrack" onclick="sw('tracking')">…</button>
  <button class="pill sw" id="swStream" onclick="sw('streaming')">…</button>
  <button class="pill sw" id="swRec" onclick="sw('recording')">…</button>
  <span class="pill" id="pGimbal"></span>
  <span class="pill" id="pPhone"></span>
  <span class="pill off" id="pPv"></span>
  <button class="pill" id="fs" onclick="toggleFullscreen()" title="Fullscreen" style="display:none">⛶</button>
</div>

<div id="mid" class="ov">
  <div class="msg" id="pvmsg"></div>
  <button class="sm" id="pvstart" onclick="preview.start()" data-i18n="startPreview">Start preview</button>
</div>

<div id="left" class="ov">
  <div id="spdbox"><span data-i18n="speed">Speed</span> <b id="spdV">50</b>
    <input type="range" id="spd" min="10" max="100" value="50" oninput="spdV.textContent=this.value; saveSpeed()"></div>
</div>

<div id="padbox" class="ov">
  <div class="pad">
    <span></span><button data-yaw="0" data-pitch="1">▲</button><span></span>
    <button data-yaw="-1" data-pitch="0">◀</button><div class="c" id="padc">&#9679;</div><button data-yaw="1" data-pitch="0">▶</button>
    <span></span><button data-yaw="0" data-pitch="-1">▼</button><span></span>
  </div>
</div>

<script src="/i18n.js"></script>
<script src="/control.js"></script>
<script>
const $ = id => document.getElementById(id);
const { api, post } = CamLeon;
// i18n: shared table in /i18n.js (keys r_* are specific to this page)
const { t } = CamLeonI18N;
CamLeonI18N.apply(document);

// speed is remembered per browser
try { const v = localStorage.getItem('speed'); if (v) { $('spd').value = v; $('spdV').textContent = v; } } catch (e) {}
function saveSpeed() { try { localStorage.setItem('speed', $('spd').value); } catch (e) {} }

// ---- the three switches + status strip -------------------------------------------------------
let state = { tracking: false, streaming: false, recording: false };
function pill(el, text, cls, show = true) { el.textContent = text; el.className = el.classList.contains('sw') ? 'pill sw ' + (cls || '') : 'pill ' + (cls || ''); el.style.display = show ? '' : 'none'; }
// Turning the stream or the recording OFF is the costly mistake on a half-transparent overlay → ask.
// (Safari pauses the <video> around the modal dialog; control.js resumes it.) Tracking switches directly.
async function sw(what) {
  const on = !state[what];
  if (!on && what === 'recording' && !confirm(t('confirmRecOff'))) return;
  if (!on && what === 'streaming' && !confirm(t('confirmStreamOff'))) return;
  await post(`/api/${what}?on=${on}`);
  refresh();
}
async function refresh() {
  try {
    const s = await api('/api/status');
    const trk = s.tracking || {}, g = s.gimbal || {}, st = s.streaming || {}, rec = s.recording || {}, ph = s.phone || {}, cfg = s.settings || {};
    const ready = !!g.connected;
    state = { tracking: !!trk.on, streaming: !!(st.on || st.state === 'connecting'), recording: !!rec.on };
    // tracking: needs the gimbal
    if (!ready) pill($('swTrack'), t('tracking') + ' · ' + t('noGimbal'), 'err');
    else if (trk.gimbalActive) pill($('swTrack'), t('tracking') + ' · ' + t('running'), 'on');
    else if (trk.on) pill($('swTrack'), t('tracking') + ' · ' + t('starting'), 'warn');
    else pill($('swTrack'), t('tracking') + ' · ' + t('off'), 'off');
    $('swTrack').disabled = !ready && !trk.on;
    // stream: needs an RTMP URL (set on the main page)
    const hasUrl = !!(cfg.rtmpUrl && cfg.rtmpUrl.length);
    if (st.state === 'live') pill($('swStream'), t('stream') + ' · ' + t('r_live'), 'on');
    else if (st.state === 'connecting') pill($('swStream'), t('stream') + ' · ' + t('connecting'), 'warn');
    else if (st.state === 'error') pill($('swStream'), t('stream') + ' · ' + t('error'), 'err');
    else pill($('swStream'), t('stream') + ' · ' + (hasUrl ? t('off') : t('noUrl')), 'off');
    $('swStream').disabled = !hasUrl && !st.on;
    pill($('swRec'), rec.on ? '● ' + t('rec') : t('rec') + ' · ' + t('off'), rec.on ? 'rec' : 'off');
    // status pills
    pill($('pGimbal'), t('gimbal') + ' ' + (g.battery != null ? g.battery + '%' : '…') + (g.powered ? ' ⚡' : ''), '', ready);
    const th = ph.thermal || 'none', hot = ['severe', 'critical', 'emergency', 'shutdown'].includes(th);
    pill($('pPhone'), t('phone') + ' ' + (ph.battery != null ? ph.battery + '%' : '…') + (ph.powered ? ' ⚡' : '') + (hot ? ' · ' + t('hot') : ''), hot ? 'warn' : '', ph.battery != null);
    document.querySelectorAll('.pad button').forEach(b => b.disabled = !!g.homing || !ready);   // homing: started on the main page
    if (!pad.moving) pad.show(g.manualYaw || 0, g.manualPitch || 0);
  } catch (e) { /* keep last known */ }
}

// ---- gimbal pad + live preview (shared logic in control.js) ---------------------------------
const pad = CamLeon.pad({ buttons: document.querySelectorAll('.pad button[data-yaw]'), centre: $('padc'), speed: () => +$('spd').value });
function showMid(html, withStart) { $('pvmsg').innerHTML = html; $('pvmsg').style.display = html ? '' : 'none'; $('pvstart').style.display = withStart ? '' : 'none'; $('mid').style.display = (html || withStart) ? '' : 'none'; }
const preview = CamLeon.preview({
  video: $('pv'),
  onState: s => { pill($('pPv'), t(s === 'connecting' ? 'r_pv_connecting' : 'pv_' + s), 'off', s !== 'connected'); if (s === 'connecting') showMid('', false); },
  onStarted: () => {},
  onStopped: () => pill($('pPv'), '', 'off', false),
  onFailed: (kind, detail) => {
    if (kind === 'nopath') showMid('<b>' + t('r_pv_nopath_title') + '</b> ' + t('r_pv_nopath_text'), true);
    else if (kind === 'failed') showMid('<b>' + t('r_pv_failed') + '</b> ' + detail, true);
    else showMid(t('r_pv_blocked'), true);
  },
});

// ---- keep the screen on while this page is visible --------------------------------------------
let wake = null;
async function keepAwake() {
  if (!('wakeLock' in navigator) || document.hidden) return;
  try { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) { keepAwake(); preview.auto(); } });
keepAwake();

// ---- fullscreen (Android/desktop; iOS Safari has no page fullscreen → "Add to Home Screen") ----
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
if (document.documentElement.requestFullscreen && !standalone) $('fs').style.display = '';
async function toggleFullscreen() {
  try {
    if (document.fullscreenElement) { await document.exitFullscreen(); return; }
    await document.documentElement.requestFullscreen({ navigationUI: 'hide' });
    try { await screen.orientation.lock('landscape'); } catch (e) {}   // tablets: keep the wide picture
  } catch (e) {}
}
document.addEventListener('fullscreenchange', () => { $('fs').textContent = document.fullscreenElement ? '✕' : '⛶'; });

refresh(); preview.auto();
setInterval(refresh, 1000); setInterval(() => preview.auto(), 8000);
</script>
</body>
</html>
