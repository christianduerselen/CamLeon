<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <!-- CamLeon: tracking reticle (lens ring + aim ticks) locked on a moving target (same artwork as the Android launcher icon) -->
  <rect x="0" y="0" width="108" height="108" rx="24" fill="#1E1B3A"/>
  <circle cx="54" cy="54" r="40" fill="#2A2650"/>
  <circle cx="54" cy="54" r="31" fill="none" stroke="#EDE7FF" stroke-width="4.6"/>
  <path d="M54,11 L54,18 M54,90 L54,97 M11,54 L18,54 M90,54 L97,54" stroke="#B9A7FF" stroke-width="4" stroke-linecap="round"/>
  <!-- focus brackets -->
  <path d="M38,44 L38,38 L44,38 M64,38 L70,38 L70,44 M70,64 L70,70 L64,70 M44,70 L38,70 L38,64" fill="none" stroke="#B9A7FF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- motion trail -->
  <path d="M30,50 L42,50 M27,56 L41,56 M31,62 L42,62" stroke="#F7923A" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round"/>
  <!-- target -->
  <circle cx="56" cy="56" r="10" fill="#F7923A"/>
  <circle cx="52.5" cy="52.5" r="2.8" fill="#FFFFFF" fill-opacity="0.45"/>
</svg>
